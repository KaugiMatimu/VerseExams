services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-versaexam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-versaexam_blog}
    ports:
      - "5433:5432"
    volumes:
      - versaexam-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-versaexam} -d ${POSTGRES_DB:-versaexam_blog}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  versaexam-postgres:
